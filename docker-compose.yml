version: '3.8'

services:
  # PostgreSQL Database (Optional production database)
  postgres:
    image: postgres:16-alpine
    container_name: focusproject_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: focusproject_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Node.js + Express REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: focusproject_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "super-secure-production-secret-token-key"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "*"
    volumes:
      - backend_db:/app/prisma

  # React Web Application
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: focusproject_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_db:
